<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#ffe9dc 0%,#fff 46%);color:#22201f;padding:72px 28px 32px}
.mark{width:64px;height:64px;border-radius:18px;background:#ff6b3d;margin-bottom:28px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800}
h1{font-size:32px;margin:0 0 8px;letter-spacing:-.02em}p.sub{color:#77706b;font-size:16px;margin:0 0 36px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 8px}
.field{height:52px;border:1.5px solid #e4ddd8;border-radius:14px;background:#fff;padding:0 16px;display:flex;align-items:center;color:#a39b95;font-size:16px;margin-bottom:20px}
.forgot{text-align:right;color:#ff6b3d;font-weight:600;font-size:14px;margin:-6px 0 28px}
.btn{height:54px;border-radius:14px;background:#22201f;color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.or{text-align:center;color:#a39b95;font-size:13px;margin:26px 0}
.alt{height:54px;border-radius:14px;border:1.5px solid #e4ddd8;display:grid;place-items:center;font-weight:600;font-size:16px;background:#fff}
.foot{text-align:center;margin-top:40px;font-size:15px;color:#77706b}.foot b{color:#22201f}
</style></head><body>
<div class="mark">P</div><h1>Welcome back</h1><p class="sub">Sign in to keep planning your trips.</p>
<label>Email</label><div class="field">you@example.com</div>
<label>Password</label><div class="field">Enter your password</div>
<div class="forgot">Forgot password?</div>
<div class="btn">Sign in</div><div class="or">or continue with</div><div class="alt">Continue with Apple</div>
<div class="foot">New here? <b>Create an account</b></div>
</body></html>
