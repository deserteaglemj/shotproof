<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">How screenshot-to-code works</title>
<desc id="d">Read the screenshot, build the code, render it in Chromium, compare with SSIM, fix the worst band and repeat up to five rounds, then report the score and gaps.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#fcfcfb;stroke:#e6e4df} .box{fill:#ffffff;stroke:#d9d6cf} .key{fill:#f1efff;stroke:#5b4ff0}
  .ink{fill:#1d1d1b} .muted{fill:#6b6a66} .num{fill:#5b4ff0} .edge{stroke:#8f8c84;fill:none} .head{fill:#8f8c84}
  .loop{stroke:#5b4ff0;fill:none} .loopt{fill:#5b4ff0}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#33332f} .box{fill:#222220;stroke:#3d3c37} .key{fill:#24214a;stroke:#8a80ff}
    .ink{fill:#f2f1ec} .muted{fill:#a3a19a} .num{fill:#8a80ff} .edge{stroke:#77746c} .head{fill:#77746c}
    .loop{stroke:#8a80ff} .loopt{fill:#8a80ff}
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="329" rx="14"/>
<text class="ink" x="28" y="40" font-size="18" font-weight="650">One loop: build it, look at it, fix it</text>

<g transform="translate(28 112)">
  <rect class="box" width="150" height="104" rx="10"/>
  <text class="num" x="16" y="28" font-size="13" font-weight="700">1  READ</text>
  <text class="ink" x="16" y="52" font-size="13">Sections, exact text,</text>
  <text class="ink" x="16" y="70" font-size="13">sampled colors,</text>
  <text class="ink" x="16" y="88" font-size="13">type sizes</text>
</g>
<g transform="translate(206 112)">
  <rect class="box" width="150" height="104" rx="10"/>
  <text class="num" x="16" y="28" font-size="13" font-weight="700">2  BUILD</text>
  <text class="ink" x="16" y="52" font-size="13">One HTML + CSS file,</text>
  <text class="ink" x="16" y="70" font-size="13">or React + Tailwind</text>
  <text class="muted" x="16" y="88" font-size="12">section by section</text>
</g>
<g transform="translate(384 112)">
  <rect class="box" width="150" height="104" rx="10"/>
  <text class="num" x="16" y="28" font-size="13" font-weight="700">3  RENDER</text>
  <text class="ink" x="16" y="52" font-size="13">Chromium, at the</text>
  <text class="ink" x="16" y="70" font-size="13">screenshot's own</text>
  <text class="ink" x="16" y="88" font-size="13">viewport and dpr</text>
</g>
<g transform="translate(562 112)">
  <rect class="key" width="150" height="104" rx="10" stroke-width="1.5"/>
  <text class="num" x="16" y="28" font-size="13" font-weight="700">4  COMPARE</text>
  <text class="ink" x="16" y="52" font-size="13">SSIM, 8 band scores,</text>
  <text class="ink" x="16" y="70" font-size="13">shift per band,</text>
  <text class="ink" x="16" y="88" font-size="13">diff heatmap</text>
</g>
<g transform="translate(740 112)">
  <rect class="box" width="132" height="104" rx="10"/>
  <text class="num" x="16" y="28" font-size="13" font-weight="700">5  REPORT</text>
  <text class="ink" x="16" y="52" font-size="13">Files, first and</text>
  <text class="ink" x="16" y="70" font-size="13">final score,</text>
  <text class="ink" x="16" y="88" font-size="13">honest gaps</text>
</g>

<path class="edge" d="M180 164H202" stroke-width="2" marker-end="url(#a)"/>
<path class="edge" d="M358 164H380" stroke-width="2" marker-end="url(#a)"/>
<path class="edge" d="M536 164H558" stroke-width="2" marker-end="url(#a)"/>
<path class="edge" d="M714 164H736" stroke-width="2" marker-end="url(#a)"/>

<path class="loop" d="M637 218 C637 290, 281 290, 281 222" stroke-width="2.5" stroke-dasharray="6 5"/>
<path class="loopt" d="M275 230 L281 218 L287 230 z"/>
<text class="loopt" x="459" y="300" font-size="13" font-weight="600" text-anchor="middle">below threshold: fix the worst band and go again (max 5 rounds)</text>
<text class="muted" x="28" y="68" font-size="13">Console errors and failed requests fail the check too, whatever the score.</text>
</svg>
